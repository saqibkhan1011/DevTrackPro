

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devtrackpro_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data

  api:
    build:
      context: ./DevTrackpro
      dockerfile: Dockerfile
    container_name: devtrackpro_api
    ports:
      - "5034:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=DevTrackProDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

volumes:
  sqldata: