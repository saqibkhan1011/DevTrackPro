name: DevTrack Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore Dependencies
      run: dotnet restore DevTrackPro.slnx

    - name: Build Solution
      run: dotnet build DevTrackPro.slnx --no-restore -c Release

    - name: Execute Unit Tests
      run: dotnet test DevTrackPro.slnx --no-build -c Release --verbosity normal

    - name: Build Docker Image
      run: |
        cd DevTrackpro
        docker build -t devtrackpro-api:latest .